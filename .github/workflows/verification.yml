# .github/workflows/verification.yml
# Chaine de verification, rejouee a chaque poussee et a chaque demande de
# fusion. Une branche dont cette chaine echoue ne peut pas etre fusionnee.
#
# Les essais n'ont besoin d'aucun service : les acces a la base, au cache et
# au stockage sont remplaces par des doubles. C'est ce qui permet a la chaine
# de tourner en moins d'une minute, et donc d'etre reellement executee a
# chaque fois plutot que contournee.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussee annule la verification precedente de la meme branche :
# inutile de payer deux fois pour un etat qui n'existe deja plus.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, essais et construction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      # Le client Prisma est genere, jamais versionne : sans cette etape
      # la verification des types echoue sur des modules introuvables.
      - name: Generer le client Prisma
        run: pnpm --filter @memora/api exec prisma generate

      - name: Verifier les types
        run: pnpm type-check

      - name: Executer les essais
        run: pnpm test

      - name: Construire
        run: pnpm build
